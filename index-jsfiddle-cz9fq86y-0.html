<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shabab Al Madina | Dragon Mart Dubai</title>

  <style>
    body {
  background: #20262e;
  padding: 20px;
  font-family: Helvetica;
}

#banner-message {
  background: #fff;
  border-radius: 4px;
  padding: 20px;
  font-size: 25px;
  text-align: center;
  transition: all 0.2s;
  margin: 0 auto;
  width: 300px;
}

button {
  background: #0084ff;
  border: none;
  border-radius: 5px;
  padding: 8px 14px;
  font-size: 15px;
  color: #fff;
}

#banner-message.alt {
  background: #0084ff;
  color: #fff;
  margin-top: 40px;
  width: 200px;
}

#banner-message.alt button {
  background: #fff;
  color: #000;
}
:root {
            --gold-light: #EAD0A2;
            --gold-main: #C89D55;
            --gold-dark: #A17632;
            --sand-bg: #F7F5F0;
            --card-bg: #FFFFFF;
            --text-main: #141414;
            --text-muted: #6B7280;
            --border: #E5E1D8;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --shadow-sm: 0 4px 20px rgba(0,0,0,0.04);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.08);
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--sand-bg);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Glass Header */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: var(--glass-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--gold-main), var(--gold-dark));
            border-radius: 10px;
            display: grid;
            place-items: center;
            color: white;
            box-shadow: 0 4px 12px rgba(200, 157, 85, 0.3);
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .brand-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .cart-trigger {
            background: #111;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .cart-trigger:hover {
            transform: translateY(-2px);
            background: var(--gold-dark);
        }

        .cart-badge {
            background: var(--gold-main);
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }

        /* Hero */
        .hero {
            text-align: center;
            padding: 3.5rem 1.5rem 2.5rem;
            background: radial-gradient(circle at top, #211d17 0%, #0d0c0a 100%);
            color: white;
        }

        .hero-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(234, 208, 162, 0.15);
            color: var(--gold-light);
            border: 1px solid rgba(234, 208, 162, 0.3);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            color: #FFFFFF;
            margin-bottom: 0.8rem;
        }

        .hero h1 span {
            color: var(--gold-light);
            font-style: italic;
        }

        /* Container Grid */
        .container {
            max-width: 1200px;
            margin: -2rem auto 4rem;
            padding: 0 1.5rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            position: relative;
            z-index: 10;
        }

        @media (max-width: 850px) {
            .container { grid-template-columns: 1fr; }
        }

        /* Showcase Card */
        .product-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .kandura-stage {
            width: 260px;
            height: 380px;
            border-radius: 20px;
            position: relative;
            transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.06), 0 15px 35px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(0,0,0,0.08);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .kandura-neck {
            width: 56px;
            height: 32px;
            border: 3px solid rgba(0,0,0,0.12);
            border-top: none;
            border-radius: 0 0 28px 28px;
            margin-top: 18px;
        }

        .kandura-tassel {
            width: 4px;
            height: 95px;
            background-color: rgba(0,0,0,0.2);
            margin-top: 4px;
            position: relative;
            border-radius: 2px;
        }

        .kandura-tassel::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: -4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(0,0,0,0.25);
        }

        .stage-caption {
            margin-top: 1.2rem;
            text-align: center;
            font-weight: 700;
            color: var(--text-main);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Direct Color Change Button Under Image */
        .color-changer-btn {
            margin-top: 1.2rem;
            width: 100%;
            max-width: 280px;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--gold-main), var(--gold-dark));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 18px rgba(200, 157, 85, 0.35);
            transition: var(--transition);
        }

        .color-changer-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(200, 157, 85, 0.45);
        }

        .color-changer-btn:active {
            transform: scale(0.97);
        }

        /* Config Card */
        .config-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 2.5rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 1.8rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px dashed var(--border);
        }

        .price-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
        }

        .price-val {
            font-size: 2.4rem;
            font-weight: 800;
            color: #111;
            font-family: 'Playfair Display', serif;
        }

        .price-val span {
            font-size: 1rem;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--gold-dark);
            margin-left: 4px;
        }

        .option-group {
            margin-bottom: 1.8rem;
        }

        .option-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        .size-pills {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .size-pill {
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: #fff;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .size-pill:hover { border-color: var(--gold-main); }

        .size-pill.active {
            background: #111;
            color: white;
            border-color: #111;
        }

        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 1rem;
        }

        .qty-picker {
            display: flex;
            align-items: center;
            background: var(--sand-bg);
            border-radius: 14px;
            padding: 4px;
            border: 1px solid var(--border);
        }

        .qty-btn {
            width: 38px;
            height: 38px;
            border: none;
            background: #fff;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .qty-btn:active { transform: scale(0.92); }

        .qty-num {
            padding: 0 16px;
            font-weight: 800;
            font-size: 1rem;
        }

        .add-btn {
            flex: 1;
            background: linear-gradient(135deg, #1A1A1A, #000000);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            transition: var(--transition);
        }

        .add-btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, var(--gold-dark), #111);
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #111;
            color: white;
            padding: 14px 28px;
            border-radius: 40px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            border: 1px solid var(--gold-main);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
  </style>

  
</head>
<body>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Header -->
    <header>
        <div class="brand-box">
            <div class="brand-icon">
                <i data-lucide="crown"></i>
            </div>
            <div>
                <div class="brand-title">SHABAB AL MADINA</div>
                <div class="brand-sub">Dragon Mart • Shop A1</div>
            </div>
        </div>
        <button class="cart-trigger" onclick="openCart()">
            <i data-lucide="shopping-bag" style="width:18px;"></i>
            <span>Cart</span>
            <span class="cart-badge" id="cart-count">0</span>
        </button>
    </header>

    <!-- Hero Banner -->
    <section class="hero">
        <div class="hero-tag">
            <i data-lucide="sparkles" style="width:14px;"></i> Direct Tailoring Deal
        </div>
        <h1>Emirati <span>Elegance</span>, Tailored.</h1>
    </section>

    <!-- Container -->
    <div class="container">
        <!-- Showcase Box -->
        <div class="product-card">
            <div class="kandura-stage" id="canvas-stage" style="background-color: #FFFFFF;">
                <div class="kandura-neck"></div>
                <div class="kandura-tassel"></div>
            </div>
            
            <div class="stage-caption">
                <i data-lucide="palette" style="width:18px; color:var(--gold-dark);"></i>
                <span id="preview-color-name">Classic White Kandura</span>
            </div>

            <!-- BUTTON BELOW THE KANDURA IMAGE -->
            <button class="color-changer-btn" onclick="cycleColor()">
                <i data-lucide="refresh-cw" style="width:18px;"></i>
                <span>Change Color Next</span>
            </button>
        </div>

        <!-- Configuration Options -->
        <div class="config-card">
            <div>
                <div class="price-row">
                    <div>
                        <div class="price-label">Fixed Retail Price</div>
                        <div style="color:var(--text-muted); font-size: 0.8rem; margin-top: 2px;">Standard Rate (All Shades)</div>
                    </div>
                    <div class="price-val">300<span>AED</span></div>
                </div>

                <!-- Size Picker -->
                <div class="option-group">
                    <div class="option-title">
                        <span>Select Length Size (Inches)</span>
                    </div>
                    <div class="size-pills">
                        <div class="size-pill" onclick="setSize(this, '54')">54</div>
                        <div class="size-pill active" onclick="setSize(this, '56')">56</div>
                        <div class="size-pill" onclick="setSize(this, '58')">58</div>
                        <div class="size-pill" onclick="setSize(this, '60')">60</div>
                    </div>
                </div>
            </div>

            <!-- Action Area -->
            <div class="action-row">
                <div class="qty-picker">
                    <button class="qty-btn" onclick="updateQty(-1)">-</button>
                    <span class="qty-num" id="qty-val">1</span>
                    <button class="qty-btn" onclick="updateQty(1)">+</button>
                </div>
                <button class="add-btn" onclick="addToCart()">
                    <i data-lucide="shopping-cart" style="width:18px;"></i>
                    <span>Add to Bag • AED <span id="total-price">300</span></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <i data-lucide="check-circle-2" style="color: var(--gold-light);"></i>
        <span id="toast-text">Color Changed!</span>
    </div>

  <script>
    // find elements
var banner = $("#banner-message")
var button = $("button")

// handle click and add class
button.on("click", () => {
  banner.toggleClass("alt")
})
lucide.createIcons();

        // Preset Common Colors
        const palette = [
            { name: "Classic White", hex: "#FFFFFF" },
            { name: "Sand Beige", hex: "#E5D7C5" },
            { name: "Slate Grey", hex: "#88909A" },
            { name: "Midnight Black", hex: "#1C1C1C" },
            { name: "Desert Brown", hex: "#634735" },
            { name: "Olive Shade", hex: "#4E5448" },
            { name: "Royal Navy", hex: "#233245" }
        ];

        let currentIndex = 0;
        let selectedSize = '56';
        let qty = 1;
        let cartCount = 0;
        const unitPrice = 300;

        // Directly cycle colors when pressing the button below the image
        function cycleColor() {
            currentIndex = (currentIndex + 1) % palette.length;
            const activeColor = palette[currentIndex];

            // Change image stage background
            const stage = document.getElementById("canvas-stage");
            stage.style.backgroundColor = activeColor.hex;
            document.getElementById("preview-color-name").innerText = `${activeColor.name} Kandura`;

            // Toast Alert
            showToast(`Switched color to ${activeColor.name}`);
        }

        function setSize(element, size) {
            document.querySelectorAll('.size-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            selectedSize = size;
        }

        function updateQty(delta) {
            if (qty + delta >= 1) {
                qty += delta;
                document.getElementById("qty-val").innerText = qty;
                document.getElementById("total-price").innerText = qty * unitPrice;
            }
        }

        function addToCart() {
            cartCount += qty;
            document.getElementById("cart-count").innerText = cartCount;
            showToast(`Added ${qty}x ${palette[currentIndex].name} (Size ${selectedSize}) to Bag!`);
        }

        function showToast(text) {
            const toast = document.getElementById("toast");
            document.getElementById("toast-text").innerText = text;
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 2500);
        }

        function openCart() {
            alert(cartCount === 0 ? "Bag is empty!" : `Cart: ${cartCount} items | Total: AED ${cartCount * unitPrice}\n\nVisit Shabab Al Madina (Shop A1) for store pickup!`);
        }
  </script>
</body>
</html>
